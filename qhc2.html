<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>群雄裂土 · 256×256 热座版</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{background:#1a2a1f;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','华文楷体',monospace}
  .game{background:#2d3e2a;padding:14px;border-radius:24px;box-shadow:0 20px 30px rgba(0,0,0,.7),inset 0 0 8px #5a7a4a;border:2px solid #6b8c5c}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#e6e3c5;padding:0 6px;flex-wrap:wrap;gap:8px}
  .title{font-size:20px;font-weight:bold;letter-spacing:3px;background:linear-gradient(135deg,#f3e9b0,#c9b36b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stats{display:flex;gap:12px;font-size:13px;background:#1e2a1a;padding:6px 14px;border-radius:30px;border:1px solid #6e8f5e;flex-wrap:wrap}
  .stats span{color:#d4dba0}
  .stats b{color:#ffd966;margin-left:3px}
  .turnbar{display:flex;align-items:center;gap:12px;background:#1e2a1a;padding:5px 16px;border-radius:30px;border:2px solid #6e8f5e;min-width:200px;justify-content:center}
  .turnbar .lbl{color:#d4dba0;font-size:13px}
  .turnbar .num{color:#ffd966;font-weight:bold;font-size:16px}
  .turnbar .who{color:#7ac96a;font-weight:bold;font-size:15px}
  .canvas-wrap{position:relative;width:840px;height:840px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #4e6b3e,0 12px 20px black}
  canvas{display:block;width:840px;height:840px;cursor:grab;background:#263321}
  canvas.dragging{cursor:grabbing}
  .hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#ffe9a8;font-size:12px;padding:3px 14px;border-radius:16px;pointer-events:none;white-space:nowrap;z-index:5}
  .minimap{position:absolute;top:6px;right:6px;width:140px;height:140px;border:2px solid #6e8f5e;border-radius:6px;background:#1b2a17;pointer-events:none;opacity:.88;z-index:5}
  .legend{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#ffe9a8;font-size:11px;padding:5px 10px;border-radius:8px;pointer-events:none;line-height:1.6;max-width:190px;z-index:5}
  .bottom{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .btns{display:flex;gap:6px;background:#1d2a18;padding:6px 12px;border-radius:30px;border:1px solid #789b64;flex-wrap:wrap}
  .btn{background:#3a5530;border:none;color:#e9f0cf;padding:7px 16px;border-radius:20px;font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 3px 0 #1b2a14;transition:.05s;font-family:inherit}
  .btn:active{transform:translateY(3px);box-shadow:0 0 0 #1b2a14}
  .btn:disabled{opacity:.35;transform:translateY(2px);box-shadow:0 0 0 #1b2a14;cursor:not-allowed}
  .btn.active{background:#b6a54b;color:#1e2a0e;box-shadow:0 3px 0 #6e5e2a,0 4px 12px #c7b14b}
  .troopbar{display:flex;align-items:center;gap:8px;background:#1d2a18;padding:6px 14px;border-radius:30px;border:1px solid #789b64}
  .troopbar label{color:#d4dba0;font-size:13px}
  .troopbar input{background:#0e160b;border:1px solid #4e6b3e;color:#ffe9a8;font-size:15px;font-weight:bold;padding:4px 10px;border-radius:16px;width:110px;text-align:center;font-family:inherit;outline:none}
  .troopbar input:focus{border-color:#ffd966}
  .troopbar .quick{display:flex;gap:4px}
  .troopbar .quick button{background:#2a3e22;border:1px solid #4e6b3e;color:#ceddae;font-size:11px;padding:3px 8px;border-radius:12px;cursor:pointer;font-family:inherit}
  .troopbar .quick button:hover{background:#3a5530;color:#ffe9a8}
  .log{font-size:13px;background:#1f2a17;padding:6px 14px;border-radius:20px;border:1px solid #7f9e69;color:#d8e2b0;flex:1;min-width:200px;text-align:center;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <div class="title">⚔️ 裂土 · 256 ⚔️</div>
    <div class="stats" id="stats"></div>
    <div class="turnbar">
      <span class="lbl">回合</span><span class="num" id="turnNum">1</span>
      <span class="who" id="whoTurn">玩家1行动</span>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="cv" width="840" height="840"></canvas>
    <div class="hint" id="hint">悬停查看格子 · 拖拽/方向键移动视角</div>
    <canvas class="minimap" id="minimap" width="140" height="140"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <div class="bottom">
    <div class="row1">
      <div class="btns">
        <button class="btn" id="btnCapital">🏰 设置都城</button>
        <button class="btn" id="btnReset">🔄 重开</button>
      </div>
      <div class="troopbar">
        <label>兵力</label>
        <input type="number" id="troopInput" value="1000" min="1" step="100">
        <div class="quick">
          <button data-add="100">+100</button>
          <button data-add="1000">+1K</button>
          <button data-add="10000">+10K</button>
          <button data-set="max">MAX</button>
          <button data-set="0">清空</button>
        </div>
      </div>
      <div class="log" id="log">点击【设置都城】依次为玩家定都</div>
    </div>
  </div>
</div>
<script>
(function(){
  const COLS=256, ROWS=256, TOTAL=COLS*ROWS;
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const mini=document.getElementById('minimap'), mctx=mini.getContext('2d');
  const statsEl=document.getElementById('stats');
  const logEl=document.getElementById('log');
  const hintEl=document.getElementById('hint');
  const legendEl=document.getElementById('legend');
  const troopInput=document.getElementById('troopInput');
  const turnNum=document.getElementById('turnNum');
  const whoTurn=document.getElementById('whoTurn');

  const CELL=24;
  const VIEW_COLS=Math.floor(840/CELL);
  const VIEW_ROWS=Math.floor(840/CELL);
  let camX=0, camY=0;

  // ===== 数据 =====
  let owner   = new Int16Array(TOTAL);
  let troops  = new Uint32Array(TOTAL);
  let terrain = new Float32Array(TOTAL);
  let bigCity = new Uint8Array(TOTAL);
  let capitals= [];
  let factions= [];
  let turn = 1;
  let nextFid = 1;

  const PALETTE=['#2f4a2f','#c94f4f','#4f7ec9','#c9a84f','#9b4fc9','#4fc9a8','#c94f9b','#8f8f8f','#e07a3a','#5ac96a','#c95a5a','#7a5ac9'];
  function colorOf(fid){ return fid===0?'#2f4a2f':PALETTE[fid%PALETTE.length]; }

  let phase='capital';
  let pendingCapital=1;
  let currentFactionIdx=0;
  let moveFrom=null;
  let hoverCol=-1, hoverRow=-1;

  let dragging=false, dragStartX=0, dragStartY=0, camStartX=0, camStartY=0, moved=false;
  let animations=[];

  function genTerrain(){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const i=r*COLS+c;
      const edge=Math.min(c,r,COLS-1-c,ROWS-1-r)/128;
      const noise=Math.sin(c*0.11)*Math.cos(r*0.08)*0.5+0.5;
      terrain[i]=Math.min(0.95,Math.max(0.1,noise*0.6+edge*0.4));
    }
  }
  genTerrain();

  const idx=(c,r)=>r*COLS+c;
  const colOf=i=>i%COLS;
  const rowOf=i=>Math.floor(i/COLS);

  function fmt(n){
    if(n<1000) return n.toString();
    if(n<1000000) return (n/1000).toFixed(n<10000?1:0)+'K';
    if(n<1000000000) return (n/1000000).toFixed(n<10000000?1:0)+'M';
    return (n/1000000000).toFixed(1)+'B';
  }

  function aliveFactions(){ return factions.filter(f=>f.alive); }
  function currentFaction(){
    const alive=aliveFactions();
    if(alive.length===0) return null;
    return alive[currentFactionIdx % alive.length];
  }

  function reset(){
    owner.fill(0); troops.fill(0); bigCity.fill(0);
    capitals=[]; factions=[]; turn=1; nextFid=1;
    phase='capital'; pendingCapital=1; currentFactionIdx=0; moveFrom=null;
    camX=0; camY=0; animations=[];
    for(let i=0;i<2;i++) factions.push({id:nextFid++, money:10000, alive:true});
    logEl.innerText='玩家1：请点击地图设置都城';
    turnNum.innerText=turn;
    whoTurn.innerText='定都阶段';
    whoTurn.style.color='#d4dba0';
    draw(); drawMini(); updateStats(); updateUI();
  }

  function draw(){
    ctx.clearRect(0,0,840,840);
    ctx.fillStyle='#0e160b'; ctx.fillRect(0,0,840,840);

    const endC=Math.min(COLS,camX+VIEW_COLS+1);
    const endR=Math.min(ROWS,camY+VIEW_ROWS+1);

    for(let r=camY;r<endR;r++){
      for(let c=camX;c<endC;c++){
        const i=idx(c,r), f=owner[i];
        const x=(c-camX)*CELL, y=(r-camY)*CELL;

        let fill;
        if(f===0){
          const t=terrain[i];
          fill=`rgb(30,${Math.floor(55+t*45)},30)`;
        } else {
          const base=colorOf(f);
          const bright=Math.min(1.6,1+troops[i]/8000);
          fill=shade(base,bright);
        }
        ctx.fillStyle=fill;
        ctx.fillRect(x,y,CELL,CELL);

        if(bigCity[i]){
          ctx.strokeStyle='#ffd966'; ctx.lineWidth=2;
          ctx.strokeRect(x+1,y+1,CELL-2,CELL-2);
        }

        // 兵力数字居中
        if(troops[i]>0){
          ctx.font='bold 11px monospace';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          const txt=fmt(troops[i]);
          ctx.lineWidth=2.5; ctx.strokeStyle='rgba(0,0,0,0.8)';
          ctx.strokeText(txt,x+CELL/2,y+CELL/2+1);
          ctx.fillStyle='#fffbe3';
          ctx.fillText(txt,x+CELL/2,y+CELL/2+1);
        }

        // 都城标记：画在格子左上角，小三角/小旗，不遮数字
        const isCap=capitals.some(cap=>cap.col===c&&cap.row===r);
        if(isCap){
          // 左上角金色小方块
          ctx.fillStyle='#ffd966';
          ctx.fillRect(x+1,y+1,6,6);
          ctx.strokeStyle='#1a1a1a';
          ctx.lineWidth=1;
          ctx.strokeRect(x+1,y+1,6,6);
        }
      }
    }

    ctx.beginPath(); ctx.strokeStyle='rgba(220,240,200,0.07)'; ctx.lineWidth=0.5;
    for(let k=0;k<=VIEW_COLS;k++){
      const p=k*CELL;
      ctx.moveTo(p,0); ctx.lineTo(p,840);
      ctx.moveTo(0,p); ctx.lineTo(840,p);
    }
    ctx.stroke();

    if(hoverCol>=camX&&hoverCol<camX+VIEW_COLS&&hoverRow>=camY&&hoverRow<camY+VIEW_ROWS){
      ctx.strokeStyle='#ffe066'; ctx.lineWidth=2.5;
      ctx.strokeRect((hoverCol-camX)*CELL,(hoverRow-camY)*CELL,CELL,CELL);
    }
    if(moveFrom){
      const sx=moveFrom.col-camX, sy=moveFrom.row-camY;
      if(sx>=0&&sx<VIEW_COLS&&sy>=0&&sy<VIEW_ROWS){
        ctx.strokeStyle='#66ffe0'; ctx.lineWidth=3;
        ctx.strokeRect(sx*CELL,sy*CELL,CELL,CELL);
      }
    }

    // 动画
    const now=performance.now();
    animations=animations.filter(a=>{
      const t=(now-a.startTime)/a.duration;
      if(t>=1) return false;
      const px=(a.fromCol+(a.toCol-a.fromCol)*t-camX)*CELL+CELL/2;
      const py=(a.fromRow+(a.toRow-a.fromRow)*t-camY)*CELL+CELL/2;
      const sx=(a.fromCol-camX)*CELL+CELL/2;
      const sy=(a.fromRow-camY)*CELL+CELL/2;
      const ex=(a.toCol-camX)*CELL+CELL/2;
      const ey=(a.toRow-camY)*CELL+CELL/2;
      ctx.beginPath();
      ctx.strokeStyle=a.color; ctx.globalAlpha=0.35; ctx.lineWidth=2;
      ctx.setLineDash([4,4]);
      ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
      ctx.beginPath();
      ctx.arc(px,py,6,0,Math.PI*2);
      ctx.fillStyle=a.color; ctx.shadowColor=a.color; ctx.shadowBlur=10;
      ctx.fill(); ctx.shadowBlur=0;
      ctx.font='bold 11px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=2.5; ctx.strokeStyle='rgba(0,0,0,0.8)';
      ctx.strokeText(a.label,px,py-12);
      ctx.fillStyle='#fffbe3';
      ctx.fillText(a.label,px,py-12);
      return true;
    });

    ctx.font='bold 13px "Segoe UI",monospace';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='#fffbe3'; ctx.shadowColor='#000'; ctx.shadowBlur=4;
    const cf=currentFaction();
    ctx.fillText(`第 ${turn} 回合 · ${cf?'玩家'+cf.id+'行动中':''} · 视口(${camX},${camY})`,8,20);
    ctx.shadowBlur=0;

    updateLegend();
  }

  function loop(){
    if(animations.length>0) draw();
    requestAnimationFrame(loop);
  }

  function drawMini(){
    const img=mctx.createImageData(140,140);
    const scale=140/COLS;
    for(let y=0;y<140;y++){
      for(let x=0;x<140;x++){
        const cx=Math.floor(x/scale), cy=Math.floor(y/scale);
        const i=idx(cx,cy), f=owner[i];
        let r,g,b;
        if(f===0){ r=30; g=60; b=30; }
        else {
          const hex=colorOf(f);
          r=parseInt(hex.slice(1,3),16); g=parseInt(hex.slice(3,5),16); b=parseInt(hex.slice(5,7),16);
        }
        const p=(y*140+x)*4;
        img.data[p]=r; img.data[p+1]=g; img.data[p+2]=b; img.data[p+3]=255;
      }
    }
    mctx.putImageData(img,0,0);
    mctx.strokeStyle='#ffe066'; mctx.lineWidth=1.5;
    mctx.strokeRect(camX*scale,camY*scale,VIEW_COLS*scale,VIEW_ROWS*scale);
  }

  function shade(hex,f){
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.min(255,Math.floor(r*f)); g=Math.min(255,Math.floor(g*f)); b=Math.min(255,Math.floor(b*f));
    return `rgb(${r},${g},${b})`;
  }

  function updateLegend(){
    legendEl.innerHTML=factions.map(f=>
      `<div style="${f.alive?'':'opacity:.4'}"><span style="display:inline-block;width:9px;height:9px;background:${colorOf(f.id)};border-radius:2px;vertical-align:middle"></span> 玩家${f.id} 💰${f.money}</div>`
    ).join('');
  }

  function updateStats(){
    let cityCount={};
    for(let i=0;i<TOTAL;i++) if(owner[i]) cityCount[owner[i]]=(cityCount[owner[i]]||0)+1;
    statsEl.innerHTML=factions.map(f=>
      `<span style="${f.alive?'':'opacity:.4'}">玩家${f.id}: 城<b>${cityCount[f.id]||0}</b> 财<b>${f.money}</b></span>`
    ).join('');
  }

  function updateUI(){
    const bc=document.getElementById('btnCapital');
    bc.classList.remove('active');
    bc.disabled=phase!=='capital';
    if(phase==='capital') bc.classList.add('active');

    const cf=currentFaction();
    if(phase==='capital'){
      whoTurn.innerText='定都阶段';
      whoTurn.style.color='#d4dba0';
    } else if(phase==='play' && cf){
      whoTurn.innerText=`玩家${cf.id}行动`;
      whoTurn.style.color=colorOf(cf.id);
    } else if(phase==='over'){
      whoTurn.innerText='游戏结束';
      whoTurn.style.color='#ffd966';
    }
  }

  document.getElementById('btnCapital').onclick=()=>{
    if(phase==='capital') logEl.innerText=`玩家${pendingCapital}：请点击地图设置都城`;
  };
  document.getElementById('btnReset').onclick=reset;

  troopInput.addEventListener('input',()=>{});
  document.querySelectorAll('.quick button').forEach(b=>{
    b.onclick=()=>{
      if(b.dataset.set==='0'){ troopInput.value=0; return; }
      if(b.dataset.set==='max'){
        if(moveFrom){ const i=idx(moveFrom.col,moveFrom.row); troopInput.value=troops[i]; }
        return;
      }
      const add=parseInt(b.dataset.add);
      troopInput.value=(parseInt(troopInput.value)||0)+add;
    };
  });

  function getInputAmount(){ return Math.max(0, parseInt(troopInput.value)||0); }

  function cellFromEvent(e){
    const rect=cv.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(cv.width/rect.width);
    const my=(e.clientY-rect.top)*(cv.height/rect.height);
    const c=camX+Math.floor(mx/CELL);
    const r=camY+Math.floor(my/CELL);
    if(c<0||c>=COLS||r<0||r>=ROWS) return null;
    return {col:c,row:r};
  }

  cv.addEventListener('mousedown',e=>{
    dragging=true; moved=false;
    dragStartX=e.clientX; dragStartY=e.clientY;
    camStartX=camX; camStartY=camY;
    cv.classList.add('dragging');
  });
  window.addEventListener('mousemove',e=>{
    if(dragging){
      const dx=Math.floor((dragStartX-e.clientX)/CELL);
      const dy=Math.floor((dragStartY-e.clientY)/CELL);
      if(Math.abs(dx)>0||Math.abs(dy)>0) moved=true;
      camX=Math.max(0,Math.min(COLS-VIEW_COLS,camStartX+dx));
      camY=Math.max(0,Math.min(ROWS-VIEW_ROWS,camStartY+dy));
      draw(); drawMini();
    }
  });
  window.addEventListener('mouseup',()=>{ dragging=false; cv.classList.remove('dragging'); });

  cv.addEventListener('mousemove',e=>{
    const cell=cellFromEvent(e);
    if(cell){
      hoverCol=cell.col; hoverRow=cell.row;
      const i=idx(cell.col,cell.row), f=owner[i];
      hintEl.innerText=`(${cell.col},${cell.row}) ${f?'玩家'+f:'中立'} 兵${fmt(troops[i])}${bigCity[i]?' ⭐大城':''}`;
    } else { hoverCol=hoverRow=-1; }
    if(!dragging) draw();
  });
  cv.addEventListener('mouseleave',()=>{ hoverCol=hoverRow=-1; draw(); });

  window.addEventListener('keydown',e=>{
    let dx=0,dy=0;
    if(e.key==='ArrowLeft') dx=-3;
    if(e.key==='ArrowRight') dx=3;
    if(e.key==='ArrowUp') dy=-3;
    if(e.key==='ArrowDown') dy=3;
    if(dx||dy){
      camX=Math.max(0,Math.min(COLS-VIEW_COLS,camX+dx));
      camY=Math.max(0,Math.min(ROWS-VIEW_ROWS,camY+dy));
      draw(); drawMini();
      e.preventDefault();
    }
  });

  cv.addEventListener('click',e=>{
    if(moved){ moved=false; return; }
    const cell=cellFromEvent(e);
    if(!cell) return;
    const {col,row}=cell;
    const i=idx(col,row);

    // 定都
    if(phase==='capital'){
      if(capitals.some(c=>c.col===col&&c.row===row)){ logEl.innerText='这里已经有都城了，换一格'; return; }
      const fid=pendingCapital;
      owner[i]=fid; troops[i]=5000;
      capitals.push({col,row,faction:fid});
      logEl.innerText=`玩家${fid} 都城已定 (${col},${row})，兵力5000`;
      if(pendingCapital<2){ pendingCapital++; logEl.innerText+=` · 玩家${pendingCapital}请设置都城`; }
      else {
        phase='play';
        currentFactionIdx=0;
        logEl.innerText='定都完成！玩家1行动。';
      }
      draw(); drawMini(); updateStats(); updateUI();
      return;
    }

    // 行动
    if(phase==='play'){
      const cf=currentFaction();
      if(!cf) return;

      if(!moveFrom){
        if(owner[i]!==cf.id){ logEl.innerText=`只能从玩家${cf.id}的城市调兵`; return; }
        moveFrom={col,row};
        troopInput.value=Math.min(troops[i], Math.max(100, Math.floor(troops[i]/2)));
        logEl.innerText=`玩家${cf.id}：已选起点(${col},${row}) 兵力${fmt(troops[i])}，输入数量后点击终点`;
        draw();
      } else {
        const amount=getInputAmount();
        if(amount<=0){ logEl.innerText='请输入大于0的兵力'; return; }
        const startIdx=idx(moveFrom.col,moveFrom.row);
        if(owner[startIdx]!==cf.id){ logEl.innerText='起点已不属于你'; moveFrom=null; draw(); return; }
        if(amount>troops[startIdx]){ logEl.innerText='兵力不足'; return; }
        doMove(moveFrom,{col,row},amount);
        moveFrom=null;
        // 操作完成 → 轮到下一个玩家
        nextPlayer();
        draw(); drawMini(); updateStats();
      }
    }
  });

  // 轮到下一个玩家
  function nextPlayer(){
    const alive=aliveFactions();
    currentFactionIdx++;
    if(currentFactionIdx >= alive.length){
      // 所有玩家行动完 → 回合结算
      currentFactionIdx=0;
      endTurn();
    } else {
      const cf=currentFaction();
      logEl.innerText+=` → 轮到玩家${cf.id}`;
      updateUI();
    }
  }

  function doMove(from,to,amount){
    const fi=idx(from.col,from.row), ti=idx(to.col,to.row);
    const fromF=owner[fi];
    const dist=Math.abs(from.col-to.col)+Math.abs(from.row-to.row);
    const lossRate=Math.min(0.5,dist*0.02);
    const arrive=Math.floor(amount*(1-lossRate));
    if(arrive<=0){ logEl.innerText='兵力全损'; return; }
    troops[fi]-=amount;

    animations.push({
      fromCol:from.col, fromRow:from.row,
      toCol:to.col, toRow:to.row,
      color:colorOf(fromF),
      label:fmt(arrive),
      startTime:performance.now(),
      duration:Math.max(400, Math.min(1800, dist*40))
    });

    const toF=owner[ti];
    if(toF===fromF){
      troops[ti]+=arrive;
      logEl.innerText=`玩家${fromF}调兵 (${from.col},${from.row})→(${to.col},${to.row}) 到达${fmt(arrive)} 损耗${Math.floor(lossRate*100)}% 合计${fmt(troops[ti])}`;
      return;
    }
    if(toF===0){
      owner[ti]=fromF; troops[ti]=arrive;
      logEl.innerText=`玩家${fromF}占领中立 (${to.col},${to.row}) 驻军${fmt(arrive)} 损耗${Math.floor(lossRate*100)}%`;
      return;
    }
    const def=troops[ti];
    const defPower=Math.floor(def*(1+terrain[ti]*0.5));
    if(arrive>defPower){
      owner[ti]=fromF; troops[ti]=arrive-defPower;
      capitals=capitals.filter(c=>!(c.col===to.col&&c.row===to.row));
      logEl.innerText=`⚔️ 玩家${fromF}攻占 (${to.col},${to.row})！攻${fmt(arrive)} vs 守${fmt(defPower)} 余${fmt(troops[ti])}`;
      checkElimination();
    } else {
      troops[ti]=defPower-arrive;
      logEl.innerText=`🛡️ 玩家${fromF}进攻 (${to.col},${to.row}) 失败！攻${fmt(arrive)} vs 守${fmt(defPower)} 守剩${fmt(troops[ti])}`;
    }
  }

  // ===== 回合结算 =====
  function endTurn(){
    for(let i=0;i<TOTAL;i++){
      const f=owner[i];
      if(f===0) continue;
      const isCap=capitals.some(c=>c.col===colOf(i)&&c.row===rowOf(i)&&c.faction===f);
      if(isCap) troops[i]+=100;
      if(bigCity[i]) troops[i]+=50;
      if(!bigCity[i]&&troops[i]>10000&&Math.random()<0.3) bigCity[i]=1;
    }
    factions.forEach(f=>{
      if(!f.alive) return;
      let cityCount=0;
      for(let i=0;i<TOTAL;i++) if(owner[i]===f.id) cityCount++;
      let income=cityCount*10;
      capitals.forEach(c=>{ if(c.faction===f.id) income+=50; });
      f.money+=income;
    });
    turn++;
    turnNum.innerText=turn;
    if(turn%100===0) checkRevolt();

    const alive=aliveFactions();
    if(alive.length===0){ phase='over'; logEl.innerText='所有势力灭亡。'; updateUI(); return; }
    if(alive.length===1){
      phase='over';
      logEl.innerText=`🏆 玩家${alive[0].id} 统一天下！`;
      updateUI();
      return;
    }
    currentFactionIdx=0;
    const cf=alive[0];
    logEl.innerText=`第 ${turn} 回合开始，玩家${cf.id}行动。`;
    updateUI();
    draw(); drawMini(); updateStats();
  }

  // ===== 起义 =====
  function checkRevolt(){
    const aliveF=aliveFactions();
    if(aliveF.length<2) return;
    const minMoney=Math.min(...aliveF.map(f=>f.money));
    for(let i=0;i<TOTAL;i++){
      const f=owner[i];
      if(f===0) continue;
      const fac=factions.find(x=>x.id===f);
      if(!fac||!fac.alive) continue;
      if(troops[i]>=1000) continue;
      if(fac.money>=minMoney*0.6) continue;
      if(Math.random()>=0.5) continue;
      const newFid=nextFid++;
      const col=colOf(i), row=rowOf(i);
      factions.push({id:newFid, money:2000, alive:true});
      owner[i]=newFid;
      troops[i]=troops[i]+2000;
      capitals.push({col,row,faction:newFid});
      logEl.innerText=`🔥 (${col},${row}) 爆发起义！新势力 玩家${newFid} 诞生！`;
      updateLegend();
      break;
    }
  }

  function checkElimination(){
    factions.forEach(f=>{
      if(!f.alive) return;
      const hasCapital=capitals.some(c=>c.faction===f.id);
      const hasLand=Array.from(owner).some(o=>o===f.id);
      if(!hasCapital&&!hasLand){ f.alive=false; logEl.innerText+=` 💀 玩家${f.id} 灭亡！`; }
    });
    const alive=aliveFactions();
    if(alive.length===1){
      phase='over';
      logEl.innerText=`🏆 玩家${alive[0].id} 统一天下！`;
      updateUI();
    }
    updateLegend();
  }

  reset();
  loop();
})();
</script>
