<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FulmonyX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0f1e;
            color: #eef5ff;
            transition: background 0.8s ease;
            overflow-x: hidden;
        }

        /* ===== 星空 + 时间变化 ===== */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 80%, #0b1424, #03060b);
            transition: background 2s ease;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) infinite alternate;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 主布局 */
        .app {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 220px;
            background: rgba(10, 18, 36, 0.65);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 2rem 1rem;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            transition: transform 0.25s ease, opacity 0.25s ease;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .sidebar.hidden {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }

        .sidebar-brand {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #a0c8ff, #7aa9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .sidebar-nav a {
            color: #c6d9f0;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: all 0.2s;
            background: transparent;
            border-left: 2px solid transparent;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            border-left-color: #7aa9ff;
            color: white;
            transform: translateX(4px);
        }

        .sidebar-nav a.active {
            background: rgba(100, 160, 255, 0.12);
            border-left-color: #7aa9ff;
            color: white;
        }

        /* ===== 主内容 ===== */
        .main {
            flex: 1;
            padding: 2.5rem 3rem;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* 头部 */
        .hero {
            margin-bottom: 3.5rem;
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 300;
            background: linear-gradient(135deg, #e0edff, #93b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .hero .sub {
            font-size: 1.1rem;
            color: #8aa3c9;
            margin-top: 0.4rem;
            letter-spacing: 1px;
            border-left: 3px solid #4a7fd4;
            padding-left: 1.2rem;
        }

        /* ===== 奖项标签云 ===== */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            margin: 2rem 0 1rem 0;
            padding: 0.2rem 0;
        }

        .tag-cloud span {
            background: rgba(247, 252, 0, 0.5);
            border: 1px solid rgba(232, 255, 100, 0.5);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #ffffff;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }

        /* ===== 勋章墙 ===== */
        .medal-section {
            margin: 0.5rem 0 2.5rem 0;
        }

        .medal-section .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4f6b94;
            margin-bottom: 0.8rem;
        }

        .medal-wall {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.2rem;
        }

        .medal {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 40px;
            padding: 0.4rem 1.4rem 0.4rem 1rem;
            font-size: 0.8rem;
            color: #e8d5a0;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            cursor: default;
            letter-spacing: 0.3px;
        }

        .medal:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(255, 215, 0, 0.08);
        }

        .medal .icon {
            font-size: 1rem;
            line-height: 1;
        }

        .medal .highlight {
            color: #ffd866;
            font-weight: 600;
        }

        .medal .sub {
            color: #7a8aaa;
            font-size: 0.65rem;
            letter-spacing: 0.3px;
        }

        /* 占位勋章（空位） */
        .medal.empty {
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.08);
            background: transparent;
            color: #3b5279;
            opacity: 0.5;
        }

        .medal.empty:hover {
            transform: none;
            box-shadow: none;
            background: transparent;
            border-color: rgba(255, 255, 255, 0.08);
        }

        /* ===== 文件下载卡片 ===== */
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2.5rem 0 1rem;
        }

        .download-card {
            background: rgba(20, 35, 65, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 1.5rem 1.2rem;
            transition: all 0.25s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .download-card:hover {
            transform: translateY(-6px);
            background: rgba(30, 55, 100, 0.6);
            border-color: rgba(120, 180, 255, 0.2);
            box-shadow: 0 16px 40px rgba(0, 20, 60, 0.6);
        }

        .download-card .title {
            font-size: 1.2rem;
            font-weight: 500;
            color: #d6e6ff;
        }

        .download-card .desc {
            font-size: 0.85rem;
            color: #89a3cf;
            line-height: 1.4;
        }

        .download-card .btn {
            margin-top: 0.4rem;
            align-self: flex-start;
            background: transparent;
            border: 1px solid #4a7fd4;
            color: #b6d0f5;
            padding: 0.3rem 1.4rem;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }

        .download-card .btn:hover {
            background: #4a7fd4;
            color: white;
            border-color: #4a7fd4;
            box-shadow: 0 0 20px rgba(70, 130, 255, 0.3);
        }

        .footer-note {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: #4f6b94;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1.5rem;
            letter-spacing: 1px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .main {
                padding: 1.8rem 1.2rem;
            }

            .hero h1 {
                font-size: 2.4rem;
            }

            .sidebar {
                width: 180px;
            }
        }
    </style>
</head>

<body>
    <div id="starfield"></div>

    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">FulmonyX</div>
            <nav class="sidebar-nav" id="sidebarNav">
                <a href="index.html" class="active" data-page="home">首页</a>
                <a href="files.html" data-page="projects">项目</a>
            </nav>

            <div style="margin-top: auto; font-size: 0.7rem; color: #3b5279; letter-spacing: 1px;">
                <span>✦ 星穹之境</span>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main" id="mainContent">
            <div class="hero">
                <h1>FulmonyX</h1>
            </div>


            <!-- ===== 勋章墙 ===== -->
            <div class="medal-section">
                <div class="section-label">✦ 勋章墙</div>
                <div class="medal-wall">

                    <div class="tag-cloud">
                        <span>CSP-J 2025 一等奖</span>
                        <span>CSP-S 2025 二等奖</span>
                        <span>清城区第十二届青少年科技创新大赛二等奖</span>
                        <span>粤港澳青少年信息学创新大赛-湛江市计算思维竞赛 一等奖</span>
                    </div>
                    <span class="medal">
                        EaseCation 起床战争
                        <span class="highlight">周榜 Top 13</span>
                        <span class="sub">· 2024</span>
                    </span>
                </div>
            </div>

            <!-- 文件下载快捷 -->
            <h2 style="font-weight: 300; letter-spacing: 2px; margin-top: 1rem; color: #0062ff;">文件下载</h2>
            <div class="download-grid" id="downloadGrid">
                <div class="download-card">
                    <div class="title">整蛊朋友软件</div>
                    <div class="desc">整蛊软件 · v2.1</div>
                    <a href="https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=e31b83d96a934aceb051e217b008bc59" target="_blank" class="btn">下载</a>
                </div>
            </div>
            <div class="footer-note">✦ 星穹之下 · 万物皆数</div>
        </main>
    </div>

    <script>
        (function () {
            console.log('%c你少看我日志！', 'font-size: 28px; font-weight: bold; color: #6ea8ff; text-shadow: 0 0 20px #3f7bff; background: #0b1424; padding: 12px 24px; border-radius: 40px; border: 1px solid #4a7fd4;');

            let secretTimer = null;
            let inputBuffer = '';
            const SECRET_PAGE = 'FulmonyX-Space.html';

            function resetSecretTimer() {
                if (secretTimer) clearTimeout(secretTimer);
                secretTimer = setTimeout(() => {
                    inputBuffer = '';
                    secretTimer = null;
                }, 5000);
            }

            document.addEventListener('keydown', function (e) {
                if (e.key.length === 1 && e.key.match(/[a-zA-Z0-9]/)) {
                    inputBuffer += e.key;
                    resetSecretTimer();
                    if (inputBuffer.toLowerCase() === 'fulmonyx') {
                        if (secretTimer) clearTimeout(secretTimer);
                        inputBuffer = '';
                        window.location.href = SECRET_PAGE;
                    }
                    if (inputBuffer.length > 20) inputBuffer = inputBuffer.slice(-10);
                }
            });

            const sidebar = document.getElementById('sidebar');
            const sidebarNav = document.getElementById('sidebarNav');
            const navLinks = sidebarNav.querySelectorAll('a');
            if (navLinks.length <= 1) {
                sidebar.classList.add('hidden');
            }

            const starfield = document.getElementById('starfield');
            const STAR_COUNT = 180;
            const stars = [];

            for (let i = 0; i < STAR_COUNT; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3.2 + 1.2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                starfield.appendChild(star);
                stars.push(star);
            }

            function updateSky() {
                const now = new Date();
                const totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                const cycleMinutes = (totalSeconds / 60) % 24;  // 每12分钟循环一次，范围 0 ~ 23.99
                const minutes = cycleMinutes * 60;  // 映射回 0 ~ 1439 的范围，复用原有的分段逻辑
                let bgGradient = '';
                let starOpacity = 1;

                if (minutes < 60) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #0a0f1e, #010308)'; starOpacity = 1; } else if (minutes < 120) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #121b2b, #030712)'; starOpacity = 0.95; } else if (minutes < 180) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #1a263b, #0a0f1e)'; starOpacity = 0.85; } else if (minutes < 240) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #22334a, #101a2a)'; starOpacity = 0.7; } else if (minutes < 300) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #2f405a, #182236)'; starOpacity = 0.5; } else if (minutes < 360) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #4d5f7a, #1f2d47)'; starOpacity = 0.3; } else if (minutes < 420) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #b58b6b, #3d4d66)'; starOpacity = 0.1; } else if (minutes < 480) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #d4b89b, #5e6f8a)'; starOpacity = 0.05; } else if (minutes < 540) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #cdd9e8, #7b8ca8)'; starOpacity = 0.02; } else if (minutes < 660) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #d6e4f5, #8ba0c0)'; starOpacity = 0.0; } else if (minutes < 780) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #e5efff, #9eb4d4)'; starOpacity = 0.0; } else if (minutes < 900) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #d3def0, #88a0c4)'; starOpacity = 0.02; } else if (minutes < 1020) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #c4cfe0, #6f87ac)'; starOpacity = 0.05; } else if (minutes < 1080) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #c29a7a, #4d6180)'; starOpacity = 0.3; } else if (minutes < 1140) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #a8765a, #334462)'; starOpacity = 0.5; } else if (minutes < 1200) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #5d4d5a, #1f2a3f)'; starOpacity = 0.8; } else if (minutes < 1320) { bgGradient = 'radial-gradient(ellipse at 50% 80%, #29384f, #0b1322)'; starOpacity = 0.95; } else { bgGradient = 'radial-gradient(ellipse at 50% 80%, #0e1428, #03060d)'; starOpacity = 1; }

                starfield.style.background = bgGradient;
                stars.forEach(s => { s.style.opacity = starOpacity; });
            }

            updateSky();
            setInterval(updateSky, 30000);

            function refreshSidebar() {
                const links = sidebarNav.querySelectorAll('a');
                if (links.length <= 1) {
                    sidebar.classList.add('hidden');
                } else {
                    sidebar.classList.remove('hidden');
                }
            }
            refreshSidebar();
        })();
    </script>
</body>

</html>
