<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火柴人电子斗蛐蛐</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #141c20;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      overflow: hidden;
    }

    .game-wrapper {
      display: flex;
      gap: 0;
      padding: 12px;
      background: #141c20;
      border-radius: 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
    }

    .sidebar {
      width: 104px;
      background: #1a252a;
      border-radius: 16px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 564px;
      box-shadow: inset 0 0 0 2px #2a3a42;
    }

    .sidebar.blue {
      box-shadow: inset 0 0 0 2px #2a6a4a;
    }

    .sidebar.red {
      box-shadow: inset 0 0 0 2px #6a2a2a;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #8ba9b3;
      text-transform: uppercase;
    }

    .sidebar.blue .sidebar-title {
      color: #6fcf97;
    }

    .sidebar.red .sidebar-title {
      color: #eb5757;
    }

    .card {
      width: 80px;
      border-radius: 8px;
      background: #243238;
      padding: 4px;
      cursor: pointer;
      border: 2px solid #2f4047;
      transition: 0.08s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card.selected {
      border-color: #f2c94c;
    }

    .sidebar.blue .card.selected {
      border-color: #6fcf97;
    }

    .sidebar.red .card.selected {
      border-color: #eb5757;
    }

    .card img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 3px;
      background: #1a252a;
      display: block;
    }

    .card .name {
      font-size: 10px;
      font-weight: 700;
      color: #cfdfe6;
    }

    .card .stat {
      font-size: 9px;
      color: #7a949e;
    }

    .canvas-container {
      position: relative;
    }

    canvas {
      display: block;
      width: 900px;
      height: 540px;
      border-radius: 12px;
      background: #1a292e;
      cursor: crosshair;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .toolbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: #1a252add;
      padding: 8px 14px;
      border-radius: 40px;
    }

    .toolbar button {
      background: #2f4047;
      border: none;
      color: #cfdfe6;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 3px 0 #141e22;
      transition: 0.06s;
      min-width: 68px;
    }

    .toolbar button:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #141e22;
    }

    .toolbar button.paused {
      background: #3a6a4a;
    }

    .toolbar button.speed {
      background: #5a4a2a;
    }

    .toolbar button.speed.x2 {
      background: #6a5a2a;
    }

    .toolbar button.speed.x3 {
      background: #7a6a2a;
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <div class="sidebar blue" id="sidebarBlue">
      <div class="sidebar-title">蓝队</div>
    </div>
    <div class="canvas-container">
      <canvas id="gameCanvas" width="900" height="540"></canvas>
      <div class="toolbar">
        <button id="pauseBtn">暂停</button>
        <button id="speedBtn" class="speed">1x</button>
        <button id="resetBtn">重置</button>
      </div>
    </div>
    <div class="sidebar red" id="sidebarRed">
      <div class="sidebar-title">红队</div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = false;
      ctx.mozImageSmoothingEnabled = false;
      ctx.webkitImageSmoothingEnabled = false;
      ctx.msImageSmoothingEnabled = false;

      const CONFIG = {
        GRAVITY: 0.4,
        GROUND_Y: 500,
        PLAYER_RADIUS: 24,
        PROJECTILE_SPEED: 8,
        PROJECTILE_RADIUS: 5,
        MAP_WIDTH: 2500,
        PIXEL_SCALE: 2.5,
        get SPRITE_WIDTH() { return 16 * this.PIXEL_SCALE; },
        get SPRITE_HEIGHT() { return 32 * this.PIXEL_SCALE; },
      };

      const TEAMS = {
        BLUE: { id: 'blue', color: '#6fcf97', bulletColor: '#a0e0b0', hpBarColor: '#6fcf97' },
        RED: { id: 'red', color: '#eb5757', bulletColor: '#ff8888', hpBarColor: '#eb5757' },
      };

      const UNIT_FILTERS = {
        soldier: '',
        sergeant: 'hue-rotate(45deg) saturate(5.2) brightness(1.6)',
        artillery: 'hue-rotate(45deg) saturate(1.3)',
        sniper: 'hue-rotate(-50deg) saturate(1.6)',
        shield: '',
        inspector: 'hue-rotate(90deg) saturate(1.8) brightness(2)',
        barricade: '',
      };

      let currentTeam = TEAMS.BLUE;
      let currentTemplate = 'soldier';

      let characters = [];
      let projectiles = [];
      let particles = [];
      let explosions = [];
      let nextId = 1;
      let cameraX = 0;
      let isPaused = false;
      let gameSpeed = 1;
      let deathStats = { blue: 0, red: 0 };

      let isDragging = false, dragStartX = 0, dragCameraX = 0, dragMoved = false;

      const IMAGES = {};
      const IMAGE_FILES = {
        move_0: 'soider_move_0.png',
        move_1: 'soider_move_1.png',
        aim: 'soider_aim.png',
        shoot: 'soider_shoot.png',
        stand: 'soider_stand.png',
        die: 'soider_die.png',
        shield_move_0: 'dunjing_move_0.png',
        shield_move_1: 'dunjing_move_1.png',
        shield_aim: 'dunjing_aim.png',
        shield_shoot: 'dunjing_shoot.png',
        shield_stand: 'dunjing_stand.png',
        shield_die: 'dunjing_die.png',
        barricade: 'luzhang.png',
      };
      for (const [key, file] of Object.entries(IMAGE_FILES)) {
        const img = new Image();
        img.src = file;
        IMAGES[key] = img;
      }

      const SOLDIER_ANIM = {
        stand: { frames: ['stand'], speed: 0 },
        move: { frames: ['move_0', 'stand', 'move_1', 'stand'], speed: 6 },
        aim: { frames: ['aim'], speed: 0 },
        shoot: { frames: ['shoot'], speed: 0 },
        die: { frames: ['die'], speed: 0 },
      };

      const SHIELD_ANIM = {
        stand: { frames: ['shield_stand'], speed: 0 },
        move: { frames: ['shield_move_0', 'shield_stand', 'shield_move_1', 'shield_stand'], speed: 6 },
        aim: { frames: ['shield_aim'], speed: 0 },
        shoot: { frames: ['shield_shoot'], speed: 0 },
        die: { frames: ['shield_die'], speed: 0 },
      };

      const BARRICADE_ANIM = {
        stand: { frames: ['barricade'], speed: 0 },
        die: { frames: ['barricade'], speed: 0 },
      };

      const MAP_W = CONFIG.MAP_WIDTH;

      function drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, anim, animFrame, team, unitType) {
        const imgKey = anim.frames[animFrame];
        const img = IMAGES[imgKey];

        // 路障画大一点
        const scaleMul = (unitType === 'barricade') ? 1.5 : 1;
        const drawWidth = CONFIG.SPRITE_WIDTH * scaleMul;
        const drawHeight = CONFIG.SPRITE_HEIGHT * scaleMul;

        if (img && img.complete && img.naturalWidth > 0) {
          ctx.save();
          let filterParts = [];
          if (isHurt) filterParts.push('brightness(1.8)');
          const baseFilter = UNIT_FILTERS[unitType] || '';
          if (baseFilter) filterParts.push(baseFilter);
          if (isHurt) filterParts.push('drop-shadow(0 0 6px #ff4444)');
          if (filterParts.length > 0) ctx.filter = filterParts.join(' ');

          if (facing < 0 && unitType !== 'barricade') {
            ctx.translate(x, y); ctx.scale(-1, 1);
            ctx.drawImage(img, -drawWidth / 2, -drawHeight, drawWidth, drawHeight);
          } else {
            ctx.drawImage(img, x - drawWidth / 2, y - drawHeight, drawWidth, drawHeight);
          }

          ctx.shadowBlur = 0;
          ctx.filter = 'none';
          const barWidth = 44, barHeight = 7;
          const barY = y - drawHeight - 12;

          ctx.fillStyle = '#1f2a2e';
          ctx.fillRect(x - barWidth / 2, barY, barWidth, barHeight);
          ctx.fillStyle = team.hpBarColor;
          ctx.fillRect(x - barWidth / 2, barY, barWidth * hpPercent, barHeight);
          ctx.strokeStyle = '#00000099';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x - barWidth / 2, barY, barWidth, barHeight);
          ctx.fillStyle = team.color;
          ctx.fillRect(x - 4, barY - 6, 8, 4);

          if (unitType === 'artillery') {
            ctx.fillStyle = '#f2c94c';
            ctx.fillRect(x - 3, barY - 12, 6, 4);
          } else if (unitType === 'sergeant') {
            ctx.fillStyle = '#ffe066';
            ctx.fillRect(x - 3, barY - 12, 6, 4);
            ctx.fillRect(x - 3, barY - 18, 6, 4);
          } else if (unitType === 'sniper') {
            ctx.fillStyle = '#b07aff';
            ctx.fillRect(x - 3, barY - 12, 6, 4);
            ctx.fillRect(x - 6, barY - 12, 3, 4);
          } else if (unitType === 'shield') {
            ctx.fillStyle = '#7fd0ff';
            ctx.fillRect(x - 4, barY - 14, 8, 6);
            ctx.fillRect(x - 2, barY - 8, 4, 3);
          } else if (unitType === 'inspector') {
            ctx.fillStyle = '#ff9933';
            ctx.fillRect(x - 4, barY - 12, 8, 4);
          }
          ctx.restore();
        } else {
          const h = 80 * scaleMul;
          ctx.save();
          ctx.translate(x, y);
          if (facing < 0 && unitType !== 'barricade') ctx.scale(-1, 1);
          let bodyColor = team.color;
          if (unitType === 'artillery') bodyColor = '#d4a76a';
          if (unitType === 'sergeant') bodyColor = '#ffe066';
          if (unitType === 'sniper') bodyColor = '#b07aff';
          if (unitType === 'shield') bodyColor = '#7fd0ff';
          if (unitType === 'inspector') bodyColor = '#ff9933';
          if (unitType === 'barricade') bodyColor = '#888888';
          ctx.fillStyle = bodyColor;
          ctx.fillRect(-8, -h + 10, 16, 16);
          ctx.fillRect(-6, -h + 28, 12, 24);
          ctx.fillRect(-8, -h + 52, 6, 24);
          ctx.fillRect(2, -h + 52, 6, 24);
          ctx.fillRect(-16, -h + 30, 8, 6);
          ctx.fillRect(8, -h + 30, 8, 6);
          if (unitType === 'shield') {
            ctx.fillStyle = '#4a90c2';
            ctx.fillRect(-20, -h + 28, 10, 20);
            ctx.fillStyle = '#7fd0ff';
            ctx.fillRect(-19, -h + 30, 8, 16);
          }
          const barWidth = 44, barY = -h - 12;
          ctx.fillStyle = '#1f2a2e';
          ctx.fillRect(-barWidth / 2, barY, barWidth, 7);
          ctx.fillStyle = team.hpBarColor;
          ctx.fillRect(-barWidth / 2, barY, barWidth * hpPercent, 7);
          ctx.strokeStyle = '#00000099';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-barWidth / 2, barY, barWidth, 7);
          ctx.restore();
        }
      }

      function defaultGetAnimState(c) {
        if (c.isDead) return 'die';
        if (c.shootTimer > 0) return 'shoot';
        if (c.attackTimer > 0 && c.attackTimer < 20 && c.aiTarget) return 'shoot';
        if (c.isAiming) return 'aim';
        if (Math.abs(c.vx) > 0.3) return 'move';
        return 'stand';
      }
      function defaultGetAnimFrame(c, animState) {
        const anim = SOLDIER_ANIM[animState] || SOLDIER_ANIM.stand;
        if (anim.speed === 0) return 0;
        return Math.floor(c.animTimer / anim.speed) % anim.frames.length;
      }

      const CHARACTER_TEMPLATES = {
        soldier: {
          name: '士兵',
          maxHp: 100,
          attack: 80,
          attackRange: 450,
          preferredDistance: 180,
          moveSpeed: 2.2,
          attackCooldown: 45,
          sightRange: 500,
          unitType: 'soldier',

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, SOLDIER_ANIM[animState] || SOLDIER_ANIM.stand, animFrame, team, 'soldier');
          },
          getAnimState: defaultGetAnimState,
          getAnimFrame: defaultGetAnimFrame,
          performAttack: function (c, target, distance, direction, projectiles) {
            const dx = target.x - c.x;
            const dy = target.y - c.y;
            const angle = Math.atan2(dy, dx);
            projectiles.push({
              x: c.x + Math.cos(angle) * 25,
              y: c.y + Math.sin(angle) * 20 - 12,
              vx: Math.cos(angle) * CONFIG.PROJECTILE_SPEED,
              vy: Math.sin(angle) * CONFIG.PROJECTILE_SPEED,
              radius: CONFIG.PROJECTILE_RADIUS,
              damage: c.attack,
              ownerId: c.id,
              teamId: c.team.id,
              color: c.team.bulletColor,
              life: 150,
              isArtilleryShell: false,
              piercing: false,
            });
          },
        },

        sergeant: {
          name: '上士',
          maxHp: 110,
          attack: 80,
          attackRange: 480,
          preferredDistance: 200,
          moveSpeed: 2.0,
          attackCooldown: 42,
          sightRange: 550,
          unitType: 'sergeant',

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, SOLDIER_ANIM[animState] || SOLDIER_ANIM.stand, animFrame, team, 'sergeant');
          },
          getAnimState: defaultGetAnimState,
          getAnimFrame: defaultGetAnimFrame,
          performAttack: function (c, target, distance, direction, projectiles) {
            const dx = target.x - c.x;
            const dy = target.y - c.y;
            const angle = Math.atan2(dy, dx);
            projectiles.push({
              x: c.x + Math.cos(angle) * 25,
              y: c.y + Math.sin(angle) * 20 - 12,
              vx: Math.cos(angle) * CONFIG.PROJECTILE_SPEED,
              vy: Math.sin(angle) * CONFIG.PROJECTILE_SPEED,
              radius: CONFIG.PROJECTILE_RADIUS,
              damage: c.attack,
              ownerId: c.id,
              teamId: c.team.id,
              color: '#66e066',
              life: 150,
              isArtilleryShell: false,
              piercing: false,
            });
          },
        },

        inspector: {
          name: '警司',
          maxHp: 65,
          attack: 60,
          attackRange: 420,
          preferredDistance: 200,
          moveSpeed: 2.0,
          attackCooldown: 40,
          sightRange: 520,
          unitType: 'inspector',

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, SOLDIER_ANIM[animState] || SOLDIER_ANIM.stand, animFrame, team, 'inspector');
          },
          getAnimState: defaultGetAnimState,
          getAnimFrame: defaultGetAnimFrame,
          performAttack: function (c, target, distance, direction, projectiles) {
            const dx = target.x - c.x;
            const dy = target.y - c.y;
            const angle = Math.atan2(dy, dx);
            projectiles.push({
              x: c.x + Math.cos(angle) * 25,
              y: c.y + Math.sin(angle) * 20 - 12,
              vx: Math.cos(angle) * CONFIG.PROJECTILE_SPEED,
              vy: Math.sin(angle) * CONFIG.PROJECTILE_SPEED,
              radius: CONFIG.PROJECTILE_RADIUS,
              damage: c.attack,
              ownerId: c.id,
              teamId: c.team.id,
              color: '#000000',
              life: 150,
              isArtilleryShell: false,
              piercing: false,
            });
          },
        },

        artillery: {
          name: '炮兵',
          maxHp: 100,
          attack: 600,
          attackRange: 600,
          preferredDistance: 600,
          moveSpeed: 1.0,
          attackCooldown: 90,
          sightRange: 900,
          unitType: 'artillery',
          explosionRadius: 140,

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, SOLDIER_ANIM[animState] || SOLDIER_ANIM.stand, animFrame, team, 'artillery');
          },
          getAnimState: defaultGetAnimState,
          getAnimFrame: defaultGetAnimFrame,
          performAttack: function (c, target, distance, direction, projectiles) {
            const dx = target.x - c.x;
            const dy = target.y - c.y;
            const angle = Math.atan2(dy, dx);
            projectiles.push({
              x: c.x + Math.cos(angle) * 25,
              y: c.y + Math.sin(angle) * 20 - 20,
              vx: Math.cos(angle) * 6,
              vy: Math.sin(angle) * 6 - 1.5,
              radius: 8,
              damage: c.attack,
              ownerId: c.id,
              teamId: c.team.id,
              color: '#f2c94c',
              life: 180,
              isArtilleryShell: true,
              explosionRadius: this.explosionRadius,
              piercing: false,
            });
          },
        },

        sniper: {
          name: '狙击手',
          maxHp: 50,
          attack: 500,
          attackRange: 850,
          preferredDistance: 800,
          moveSpeed: 1.4,
          attackCooldown: 110,
          sightRange: 850,
          unitType: 'sniper',
          pierceChance: 0.5,

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, SOLDIER_ANIM[animState] || SOLDIER_ANIM.stand, animFrame, team, 'sniper');
          },
          getAnimState: defaultGetAnimState,
          getAnimFrame: defaultGetAnimFrame,
          performAttack: function (c, target, distance, direction, projectiles) {
            const dx = target.x - c.x;
            const dy = target.y - c.y;
            const angle = Math.atan2(dy, dx);
            const willPierce = Math.random() < this.pierceChance;
            projectiles.push({
              x: c.x + Math.cos(angle) * 30,
              y: c.y + Math.sin(angle) * 20 - 12,
              vx: Math.cos(angle) * 14,
              vy: Math.sin(angle) * 14,
              radius: 4,
              damage: c.attack,
              ownerId: c.id,
              teamId: c.team.id,
              color: '#b07aff',
              life: 200,
              isArtilleryShell: false,
              piercing: willPierce,
              hitIds: [],
            });
          },
        },

        shield: {
          name: '盾警',
          maxHp: 100,
          attack: 30,
          attackRange: 350,
          preferredDistance: 150,
          moveSpeed: 1.6,
          attackCooldown: 55,
          sightRange: 450,
          unitType: 'shield',

          shieldRadius: 260,
          damageReduction: 0.7,

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, SHIELD_ANIM[animState] || SHIELD_ANIM.stand, animFrame, team, 'shield');
          },
          getAnimState: function (c) {
            if (c.isDead) return 'die';
            if (c.shootTimer > 0) return 'shoot';
            if (c.attackTimer > 0 && c.attackTimer < 18 && c.aiTarget) return 'shoot';
            if (c.isAiming) return 'aim';
            if (Math.abs(c.vx) > 0.3) return 'move';
            return 'stand';
          },
          getAnimFrame: function (c, animState) {
            const anim = SHIELD_ANIM[animState] || SHIELD_ANIM.stand;
            if (anim.speed === 0) return 0;
            return Math.floor(c.animTimer / anim.speed) % anim.frames.length;
          },
          performAttack: function (c, target, distance, direction, projectiles) {
            const dx = target.x - c.x;
            const dy = target.y - c.y;
            const angle = Math.atan2(dy, dx);
            projectiles.push({
              x: c.x + Math.cos(angle) * 25,
              y: c.y + Math.sin(angle) * 20 - 12,
              vx: Math.cos(angle) * CONFIG.PROJECTILE_SPEED,
              vy: Math.sin(angle) * CONFIG.PROJECTILE_SPEED,
              radius: CONFIG.PROJECTILE_RADIUS,
              damage: c.attack,
              ownerId: c.id,
              teamId: c.team.id,
              color: c.team.bulletColor,
              life: 150,
              isArtilleryShell: false,
              piercing: false,
            });
          },
        },

        barricade: {
          name: '路障',
          maxHp: 20000,
          attack: 0,
          attackRange: 0,
          preferredDistance: 0,
          moveSpeed: 0,
          attackCooldown: 99999,
          sightRange: 0,
          unitType: 'barricade',
          isBarricade: true,

          draw: function (ctx, x, y, facing, hpPercent, isHurt, animState, animFrame, team) {
            drawPixelUnit(ctx, x, y, facing, hpPercent, isHurt, BARRICADE_ANIM[animState] || BARRICADE_ANIM.stand, animFrame, team, 'barricade');
          },
          getAnimState: function (c) {
            return c.isDead ? 'die' : 'stand';
          },
          getAnimFrame: function () {
            return 0;
          },
          performAttack: function () {
            // 路障不攻击
          },
        },
      };

      class Character {
        constructor(templateName, x, y, team) {
          const template = CHARACTER_TEMPLATES[templateName];
          if (!template) throw new Error(`未知角色模板: ${templateName}`);

          this.id = nextId++;
          this.templateName = templateName;
          this.template = template;
          this.team = team || TEAMS.BLUE;
          this.unitType = template.unitType || 'soldier';
          this.isArtillery = (this.unitType === 'artillery');

          this.maxHp = template.maxHp;
          this.hp = template.maxHp;
          this.attack = template.attack;
          this.attackRange = template.attackRange;
          this.preferredDistance = template.preferredDistance;
          this.moveSpeed = template.moveSpeed;
          this.attackCooldown = template.attackCooldown;
          this.sightRange = template.sightRange || 600;

          this.x = x; this.y = y;
          this.vx = 0; this.vy = 0;
          this.onGround = false;
          this.facing = 1;

          this.attackTimer = 0;
          this.shootTimer = 0;
          this.hurtTimer = 0;
          this.isDead = false;
          this.deathTimer = 0;
          this.isAiming = false;
          this.aiTarget = null;
          this.wanderTimer = 0;
          this.wanderDirection = 0;
          this.animTimer = 0;
          this.animState = 'stand';
          this.animFrame = 0;

          this.leaderDirection = 0;
          this.leaderX = null;
          this.damageReduction = 0;
        }

        update(characters, projectiles, particles, explosions) {
          if (this.isDead) {
            this.deathTimer--;
            this.animTimer++;
            this.animState = 'die';
            this.animFrame = 0;
            return;
          }

          // ============================================================
          // 路障：不移动、不索敌、不攻击，只受物理和击退影响
          // ============================================================
          if (this.template.isBarricade) {
            this.animTimer++;
            if (this.hurtTimer > 0) this.hurtTimer--;

            this.vy += CONFIG.GRAVITY;
            this.y += this.vy;
            this.x += this.vx;

            if (this.y > CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS) {
              this.y = CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS;
              this.vy = 0;
              this.onGround = true;
            } else {
              this.onGround = false;
            }

            const margin = CONFIG.PLAYER_RADIUS;
            if (this.x < margin) this.x = margin;
            if (this.x > MAP_W - margin) this.x = MAP_W - margin;

            // 路障摩擦大一点，被炸飞后滑行一段停下
            this.vx *= 0.92;
            if (Math.abs(this.vx) < 0.05) this.vx = 0;

            this.animState = 'stand';
            this.animFrame = 0;
            return;
          }

          this.animTimer++;
          if (this.attackTimer > 0) this.attackTimer--;
          if (this.shootTimer > 0) this.shootTimer--;
          if (this.hurtTimer > 0) this.hurtTimer--;
          if (this.wanderTimer > 0) this.wanderTimer--;

          this.vy += CONFIG.GRAVITY;
          this.y += this.vy;
          this.x += this.vx;

          if (this.y > CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS) {
            this.y = CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS;
            this.vy = 0;
            this.onGround = true;
          } else {
            this.onGround = false;
          }

          const margin = CONFIG.PLAYER_RADIUS;
          if (this.x < margin) this.x = margin;
          if (this.x > MAP_W - margin) this.x = MAP_W - margin;

          this.vx *= 0.85;
          if (Math.abs(this.vx) < 0.05) this.vx = 0;

          // 索敌
          let target = null, minDist = Infinity;
          for (let other of characters) {
            if (other === this || other.isDead) continue;
            if (other.team.id === this.team.id) continue;
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist && dist < this.sightRange) {
              minDist = dist;
              target = other;
            }
          }
          this.aiTarget = target;
          this.isAiming = false;

          // 盾警减伤光环（叠加）
          this.damageReduction = 0;
          let remainMultiplier = 1;
          for (let other of characters) {
            if (other.isDead) continue;
            if (other.team.id !== this.team.id) continue;
            if (other.unitType !== 'shield') continue;
            const r = other.template.shieldRadius || 260;
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < r) {
              const red = other.template.damageReduction || 0.7;
              remainMultiplier *= (1 - red);
            }
          }
          this.damageReduction = 1 - remainMultiplier;

          // 领导光环
          this.leaderDirection = 0;
          this.leaderX = null;

          if (this.unitType === 'soldier' || this.unitType === 'artillery' || this.unitType === 'shield' || this.unitType === 'inspector') {
            let nearestSergeant = null;
            let nearestDist = Infinity;
            const LEADER_RANGE = 700;

            for (let other of characters) {
              if (other === this || other.isDead) continue;
              if (other.team.id !== this.team.id) continue;
              if (other.unitType !== 'sergeant') continue;

              const dx = other.x - this.x;
              const dy = other.y - this.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < nearestDist && dist < LEADER_RANGE) {
                nearestDist = dist;
                nearestSergeant = other;
              }
            }

            if (nearestSergeant) {
              const dx = nearestSergeant.x - this.x;
              this.leaderDirection = dx > 0 ? 1 : -1;
              this.leaderX = nearestSergeant.x;
            }
          }

          if (target && !target.isDead && minDist < this.sightRange) {
            const dx = target.x - this.x;
            const dy = target.y - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const direction = dx > 0 ? 1 : -1;
            this.facing = direction;

            const pd = this.preferredDistance;
            if (distance < pd - 40) {
              this.vx -= direction * this.moveSpeed * 0.7;
            } else if (distance > pd + 60) {
              this.vx += direction * this.moveSpeed * 0.6;
            } else if (distance > pd + 20) {
              this.vx += direction * this.moveSpeed * 0.3;
            } else {
              this.doWander();
            }

            if (this.attackTimer > 0 && distance < this.attackRange && this.shootTimer <= 0) {
              this.isAiming = true;
            }

            if (this.attackTimer <= 0 && distance < this.attackRange) {
              this.attackTimer = this.attackCooldown;
              this.shootTimer = this.isArtillery ? 20 : (this.unitType === 'sniper' ? 25 : (this.unitType === 'shield' ? 18 : 15));
              this.isAiming = false;
              this.template.performAttack(this, target, distance, direction, projectiles);
            }
          } else {
            this.doWander();
          }

          const maxSpeed = this.moveSpeed * 2.2;
          if (this.vx > maxSpeed) this.vx = maxSpeed;
          if (this.vx < -maxSpeed) this.vx = -maxSpeed;

          if (this.x < margin) this.x = margin;
          if (this.x > MAP_W - margin) this.x = MAP_W - margin;

          this.animState = this.template.getAnimState(this);
          this.animFrame = this.template.getAnimFrame(this, this.animState);
        }

        doWander() {
          if (this.leaderDirection !== 0 && this.leaderX !== null) {
            if (Math.random() < 0.1) {
              this.vx += this.leaderDirection * this.moveSpeed * 0.35;
              if (Math.abs(this.vx) > 0.2) {
                this.facing = this.vx > 0 ? 1 : -1;
              }
              return;
            }
          }

          if (this.wanderTimer <= 0) {
            if (Math.random() < 0.08) {
              this.wanderDirection = (Math.random() - 0.5) * 2;
              this.wanderTimer = 30 + Math.floor(Math.random() * 60);
            }
          }
          if (this.wanderTimer > 0) {
            this.vx += this.wanderDirection * 0.18;
            if (Math.abs(this.vx) > 0.2) this.facing = this.vx > 0 ? 1 : -1;
          } else {
            if (Math.random() < 0.02) this.vx += (Math.random() - 0.5) * 0.8;
          }
        }

        takeDamage(amount, attackerId) {
          if (this.isDead) return;
          const reduced = amount * (1 - this.damageReduction);
          this.hp -= reduced;
          this.hurtTimer = 8;
          if (this.hp <= 0) {
            this.hp = 0;
            this.isDead = true;
            this.deathTimer = 40;
            if (this.team.id === 'blue') deathStats.blue++;
            else if (this.team.id === 'red') deathStats.red++;

            for (let i = 0; i < 8; i++) {
              particles.push({
                x: this.x, y: this.y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 1.5) * 3,
                life: 30,
                color: this.team.color
              });
            }
          }
        }

        draw(ctx) {
          if (this.isDead) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.deathTimer / 40);
            if (this.unitType === 'shield') {
              drawPixelUnit(ctx, this.x, this.y, this.facing, 0, false, SHIELD_ANIM.die, 0, this.team, 'shield');
            } else if (this.unitType === 'barricade') {
              drawPixelUnit(ctx, this.x, this.y, this.facing, 0, false, BARRICADE_ANIM.die, 0, this.team, 'barricade');
            } else {
              drawPixelUnit(ctx, this.x, this.y, this.facing, 0, false, SOLDIER_ANIM.die, 0, this.team, this.unitType);
            }
            ctx.restore();
            return;
          }
          const hpPercent = this.hp / this.maxHp;
          this.template.draw(ctx, this.x, this.y, this.facing, hpPercent, this.hurtTimer > 0, this.animState, this.animFrame, this.team);
          if (this.hurtTimer > 0) {
            ctx.save();
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(this.x, this.y - CONFIG.PLAYER_RADIUS * 0.5, CONFIG.PLAYER_RADIUS * 1.6, 0, Math.PI * 2);
            ctx.fillStyle = this.team.color;
            ctx.fill();
            ctx.restore();
          }
        }

        getData() {
          return { id: this.id, template: this.templateName, team: this.team.id, hp: this.hp, maxHp: this.maxHp, x: this.x, y: this.y };
        }
      }

      function createExplosion(x, y, radius, totalDamage, attackerId, teamId, characters) {
        explosions.push({ x, y, radius, life: 25, maxLife: 25 });

        const victims = [];
        for (let c of characters) {
          if (c.isDead) continue;
          if (c.team.id === teamId) continue;
          if (c.id === attackerId) continue;
          const dx = c.x - x;
          const dy = c.y - (y + 12);
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < radius + CONFIG.PLAYER_RADIUS) {
            victims.push({ c, dx, dy, dist });
          }
        }

        if (victims.length > 0) {
          const dmg = totalDamage / victims.length;
          for (let v of victims) {
            v.c.takeDamage(dmg, attackerId);

            // 爆炸冲击：把单位向外推开
            const angle = Math.atan2(v.dy, v.dx);
            const distFactor = Math.max(0, 1 - v.dist / radius);
            const knockback = 8 + distFactor * 10;
            v.c.vx += Math.cos(angle) * knockback;
            v.c.vy -= 2 + distFactor * 3;
          }
        }

        for (let i = 0; i < 16; i++) {
          const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
          const speed = 2 + Math.random() * 3;
          particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 25 + Math.random() * 15,
            color: Math.random() < 0.5 ? '#f2c94c' : '#ff8844'
          });
        }
      }

      function gameLoop() {
        if (!isPaused) {
          for (let s = 0; s < gameSpeed; s++) {
            update();
          }
        }
        draw();
        requestAnimationFrame(gameLoop);
      }

      function update() {
        for (let i = characters.length - 1; i >= 0; i--) {
          const c = characters[i];
          c.update(characters, projectiles, particles, explosions);
          if (c.isDead && c.deathTimer <= 0) characters.splice(i, 1);
        }

        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.isArtilleryShell) p.vy += 0.06;
          p.life--;

          if (p.life <= 0 || p.x < -50 || p.x > MAP_W + 50 || p.y > CONFIG.GROUND_Y + 50 || p.y < -100) {
            if (p.isArtilleryShell) createExplosion(p.x, CONFIG.GROUND_Y - 10, p.explosionRadius, p.damage, p.ownerId, p.teamId, characters);
            projectiles.splice(i, 1);
            continue;
          }

          let hit = false;
          if (p.isArtilleryShell) {
            if (p.y >= CONFIG.GROUND_Y - 5) {
              createExplosion(p.x, CONFIG.GROUND_Y - 10, p.explosionRadius, p.damage, p.ownerId, p.teamId, characters);
              projectiles.splice(i, 1);
              continue;
            }
            for (let c of characters) {
              if (c.isDead || c.id === p.ownerId || c.team.id === p.teamId) continue;
              const dx = c.x - p.x;
              const dy = (c.y - 12) - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < CONFIG.PLAYER_RADIUS + p.radius) {
                createExplosion(p.x, p.y, p.explosionRadius, p.damage, p.ownerId, p.teamId, characters);
                hit = true;
                break;
              }
            }
          } else {
            for (let c of characters) {
              if (c.isDead || c.id === p.ownerId || c.team.id === p.teamId) continue;
              if (p.hitIds && p.hitIds.includes(c.id)) continue;
              const dx = c.x - p.x;
              const dy = (c.y - 12) - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < CONFIG.PLAYER_RADIUS + p.radius) {
                c.takeDamage(p.damage, p.ownerId);

                if (p.piercing) {
                  if (!p.hitIds) p.hitIds = [];
                  p.hitIds.push(c.id);
                  p.damage *= 0.7;
                } else {
                  hit = true;
                }

                for (let k = 0; k < 5; k++) {
                  particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.8) * 3, life: 18, color: p.color });
                }
                if (!p.piercing) break;
              }
            }
          }
          if (hit) projectiles.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.1; pt.life--;
          if (pt.life <= 0) particles.splice(i, 1);
        }
        for (let i = explosions.length - 1; i >= 0; i--) {
          explosions[i].life--;
          if (explosions[i].life <= 0) explosions.splice(i, 1);
        }
      }

      function getTeamStats() {
        const stats = {
          blue: { alive: 0, totalHp: 0, maxHp: 0, dead: deathStats.blue },
          red: { alive: 0, totalHp: 0, maxHp: 0, dead: deathStats.red },
        };
        for (let c of characters) {
          if (c.isDead) continue;
          const s = stats[c.team.id];
          if (!s) continue;
          s.alive++;
          s.totalHp += c.hp;
          s.maxHp += c.maxHp;
        }
        return stats;
      }

      function drawStatsPanel() {
        const stats = getTeamStats();
        const panelW = 360, panelH = 52;
        const panelX = canvas.width / 2 - panelW / 2;
        const panelY = 12;

        ctx.save();
        ctx.fillStyle = '#141c20dd';
        ctx.strokeStyle = '#2f4047';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(panelX, panelY, panelW, panelH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, panelY + 8);
        ctx.lineTo(canvas.width / 2, panelY + panelH - 8);
        ctx.strokeStyle = '#2f4047';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const blueCx = panelX + panelW * 0.25;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.font = 'bold 14px "Segoe UI"';
        ctx.fillStyle = '#6fcf97';
        ctx.fillText('蓝队', blueCx, panelY + 14);

        ctx.font = 'bold 13px "Segoe UI"';
        ctx.fillStyle = '#cfdfe6';
        const blueHpPercent = stats.blue.maxHp > 0 ? (stats.blue.totalHp / stats.blue.maxHp * 100).toFixed(0) : 0;
        ctx.fillText(`存活 ${stats.blue.alive} 阵亡 ${stats.blue.dead}`, blueCx, panelY + 36);

        const redCx = panelX + panelW * 0.75;
        ctx.font = 'bold 14px "Segoe UI"';
        ctx.fillStyle = '#eb5757';
        ctx.fillText('红队', redCx, panelY + 14);

        ctx.font = 'bold 13px "Segoe UI"';
        ctx.fillStyle = '#cfdfe6';
        const redHpPercent = stats.red.maxHp > 0 ? (stats.red.totalHp / stats.red.maxHp * 100).toFixed(0) : 0;
        ctx.fillText(`存活 ${stats.red.alive} 阵亡 ${stats.red.dead}`, redCx, panelY + 36);

        const barY = panelY + panelH - 4;
        const barW = panelW - 24;
        const barX = panelX + 12;
        const blueRatio = stats.blue.totalHp + stats.red.totalHp > 0
          ? stats.blue.totalHp / (stats.blue.totalHp + stats.red.totalHp)
          : 0.5;

        ctx.fillStyle = '#1f2a2e';
        ctx.fillRect(barX, barY, barW, 3);
        ctx.fillStyle = '#6fcf97';
        ctx.fillRect(barX, barY, barW * blueRatio, 3);
        ctx.fillStyle = '#eb5757';
        ctx.fillRect(barX + barW * blueRatio, barY, barW * (1 - blueRatio), 3);

        ctx.restore();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }

      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          if (w < 2 * r) r = w / 2;
          if (h < 2 * r) r = h / 2;
          this.beginPath();
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          this.closePath();
          return this;
        };
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-Math.round(cameraX), 0);

        ctx.fillStyle = '#1c2e34';
        ctx.fillRect(0, CONFIG.GROUND_Y - 4, MAP_W, 8);
        ctx.fillStyle = '#31515e';
        for (let i = 0; i < MAP_W; i += 40) ctx.fillRect(i, CONFIG.GROUND_Y + 2, 20, 6);
        ctx.fillStyle = '#0f1a1e';
        ctx.fillRect(0, CONFIG.GROUND_Y + 8, MAP_W, 12);

        for (let i = 0; i < MAP_W; i += 50) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
          ctx.strokeStyle = '#2b4b5511'; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.fillStyle = '#3d5a6444';
        ctx.fillRect(0, 0, 10, canvas.height);
        ctx.fillRect(MAP_W - 10, 0, 10, canvas.height);

        // 盾警光环可视化
        for (let c of characters) {
          if (c.isDead) continue;
          if (c.unitType !== 'shield') continue;
          const r = c.template.shieldRadius || 260;
          ctx.save();
          ctx.globalAlpha = 0.08;
          ctx.beginPath();
          ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
          ctx.fillStyle = '#7fd0ff';
          ctx.fill();
          ctx.globalAlpha = 0.25;
          ctx.beginPath();
          ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
          ctx.strokeStyle = '#7fd0ff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        for (let p of projectiles) {
          if (p.isArtilleryShell) {
            ctx.fillStyle = '#f2c94c';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 12;
            ctx.fillRect(Math.round(p.x - p.radius), Math.round(p.y - p.radius), p.radius * 2, p.radius * 2);
            ctx.fillStyle = '#fff5cc';
            ctx.fillRect(Math.round(p.x - p.radius / 2), Math.round(p.y - p.radius / 2), p.radius, p.radius);
            ctx.shadowBlur = 0;
          } else {
            if (p.piercing) {
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 10;
            }
            ctx.fillStyle = p.color || '#f0e68c';
            ctx.fillRect(Math.round(p.x - p.radius), Math.round(p.y - p.radius), p.radius * 2, p.radius * 2);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.4;
            ctx.fillRect(Math.round(p.x - p.vx * 2 - p.radius), Math.round(p.y - p.vy * 2 - p.radius), p.radius * 2, p.radius * 2);
            ctx.globalAlpha = 1.0;
          }
        }

        for (let ex of explosions) {
          const progress = 1 - ex.life / ex.maxLife;
          const r = ex.radius * (0.5 + progress * 0.8);
          const a = ex.life / ex.maxLife;
          ctx.save();
          ctx.globalAlpha = a * 0.6;
          ctx.beginPath(); ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
          ctx.fillStyle = '#f2c94c'; ctx.fill();
          ctx.globalAlpha = a * 0.8;
          ctx.beginPath(); ctx.arc(ex.x, ex.y, r * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = '#ff8844'; ctx.fill();
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.arc(ex.x, ex.y, r * 0.3, 0, Math.PI * 2);
          ctx.fillStyle = '#fff5cc'; ctx.fill();
          ctx.restore();
        }

        for (let pt of particles) {
          ctx.globalAlpha = pt.life / 30;
          ctx.fillStyle = pt.color || '#fff';
          ctx.fillRect(Math.round(pt.x) - 2, Math.round(pt.y) - 2, 4, 4);
        }
        ctx.globalAlpha = 1.0;

        for (let c of characters) c.draw(ctx);

        ctx.restore();

        drawStatsPanel();

        const mapW = 200;
        const mapX = canvas.width - mapW - 20;
        const mapY = canvas.height - 30;
        ctx.fillStyle = '#3d5a6488';
        ctx.fillRect(mapX, mapY, mapW, 10);
        const viewRatio = canvas.width / MAP_W;
        const viewX = (cameraX / MAP_W) * mapW + mapX;
        ctx.fillStyle = '#8ba9b3';
        ctx.fillRect(viewX, mapY, mapW * viewRatio, 10);
        ctx.fillStyle = '#f2c94c';
        ctx.fillRect(mapX, mapY - 2, 3, 14);
        ctx.fillRect(mapX + mapW - 3, mapY - 2, 3, 14);

        if (gameSpeed > 1) {
          ctx.font = 'bold 14px "Segoe UI"';
          ctx.fillStyle = '#f2c94c';
          ctx.textAlign = 'left';
          ctx.fillText(` ${gameSpeed}x`, 20, 30);
        }
      }

      function placeCharacter(clientX, clientY, templateName, team) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const screenX = (clientX - rect.left) * scaleX;
        let worldX = screenX + cameraX;
        worldX = Math.max(CONFIG.PLAYER_RADIUS, Math.min(MAP_W - CONFIG.PLAYER_RADIUS, worldX));
        const groundY = CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS;
        characters.push(new Character(templateName, worldX, groundY, team));
      }

      function buildCards() {
        const blueSidebar = document.getElementById('sidebarBlue');
        const redSidebar = document.getElementById('sidebarRed');

        blueSidebar.innerHTML = '<div class="sidebar-title">蓝队</div>';
        redSidebar.innerHTML = '<div class="sidebar-title">红队</div>';

        const cardList = [
          { key: 'soldier', name: '士兵', stat: '100/80', img: 'soider_stand.png' },
          { key: 'sergeant', name: '上士', stat: '110/80', img: 'soider_stand.png' },
          { key: 'inspector', name: '警司', stat: '90/60', img: 'soider_stand.png' },
          { key: 'artillery', name: '炮兵', stat: '100/300', img: 'soider_stand.png' },
          { key: 'sniper', name: '狙击', stat: '50/200', img: 'soider_stand.png' },
          { key: 'shield', name: '盾警', stat: '100/30', img: 'dunjing_stand.png' },
          { key: 'barricade', name: '路障', stat: '20000/0', img: 'luzhang.png' },
        ];

        for (const side of ['blue', 'red']) {
          const sidebar = side === 'blue' ? blueSidebar : redSidebar;
          const team = side === 'blue' ? TEAMS.BLUE : TEAMS.RED;

          for (const info of cardList) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.template = info.key;
            card.dataset.team = side;

            const img = document.createElement('img');
            img.src = info.img;
            img.alt = info.name;
            const filter = UNIT_FILTERS[info.key];
            if (filter) img.style.filter = filter;
            card.appendChild(img);

            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = info.name;
            card.appendChild(name);

            const stat = document.createElement('div');
            stat.className = 'stat';
            stat.textContent = info.stat;
            card.appendChild(stat);

            card.addEventListener('click', () => {
              currentTemplate = info.key;
              currentTeam = team;
              document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
              document.querySelectorAll(`.card[data-template="${info.key}"]`).forEach(c => c.classList.add('selected'));
            });

            sidebar.appendChild(card);
          }
        }

        currentTemplate = 'soldier';
        currentTeam = TEAMS.BLUE;
        const defaultCard = blueSidebar.querySelector('.card[data-template="soldier"]');
        if (defaultCard) defaultCard.classList.add('selected');
      }

      canvas.addEventListener('click', (e) => {
        if (dragMoved) { dragMoved = false; return; }
        placeCharacter(e.clientX, e.clientY, currentTemplate, currentTeam);
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 60 : -60;
        cameraX = Math.max(0, Math.min(MAP_W - canvas.width, cameraX + delta));
      }, { passive: false });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 || e.button === 1) {
          isDragging = true;
          dragMoved = false;
          dragStartX = e.clientX;
          dragCameraX = cameraX;
        }
      });
      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const delta = (e.clientX - dragStartX) * scaleX;
          if (Math.abs(delta) > 3) dragMoved = true;
          cameraX = Math.max(0, Math.min(MAP_W - canvas.width, dragCameraX - delta));
        }
      });
      window.addEventListener('mouseup', () => { isDragging = false; });

      document.getElementById('pauseBtn').addEventListener('click', (e) => {
        isPaused = !isPaused;
        e.target.textContent = isPaused ? '继续' : '暂停';
        e.target.classList.toggle('paused', isPaused);
      });

      document.getElementById('speedBtn').addEventListener('click', (e) => {
        gameSpeed = gameSpeed === 1 ? 2 : (gameSpeed === 2 ? 3 : 1);
        e.target.textContent = gameSpeed + 'x';
        e.target.classList.remove('x2', 'x3');
        if (gameSpeed === 2) e.target.classList.add('x2');
        if (gameSpeed === 3) e.target.classList.add('x3');
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        characters = [];
        projectiles = [];
        particles = [];
        explosions = [];
        cameraX = 0;
        deathStats = { blue: 0, red: 0 };
        if (isPaused) {
          isPaused = false;
          document.getElementById('pauseBtn').textContent = '暂停';
          document.getElementById('pauseBtn').classList.remove('paused');
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          document.getElementById('pauseBtn').click();
        }
        if (e.code === 'KeyF') {
          e.preventDefault();
          document.getElementById('speedBtn').click();
        }
      });

      function init() {
  buildCards();

  // ============================================================
  // 蓝队：250 人暴乱方阵（150 盾警 + 100 士兵）
  // ============================================================
  const blueStartX = 600;
  const blueBaseY = CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS;

  // 150 个盾警：排成 5 排，每排 30 个，紧凑阵列
  for (let i = 0; i < 150; i++) {
    const row = Math.floor(i / 30);
    const col = i % 30;
    const x = blueStartX + col * 14 + row * 4;
    const y = blueBaseY - row * 3;
    const c = new Character('shield', x, y, TEAMS.BLUE);
    c.facing = 1;
    characters.push(c);
  }

  // 100 个士兵：躲在盾警后面，排成 4 排，每排 25 个
  for (let i = 0; i < 100; i++) {
    const row = Math.floor(i / 25);
    const col = i % 25;
    const x = blueStartX + 500 + col * 18 + row * 4;
    const y = blueBaseY - row * 3;
    const c = new Character('soldier', x, y, TEAMS.BLUE);
    c.facing = 1;
    characters.push(c);
  }

  // ============================================================
  // 红队：1900 个炮兵，铺满后半张地图
  // ============================================================
  const redStartX = 1100;
  const redBaseY = CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS;

  // 1900 个炮兵：排成 38 排，每排 50 个
  for (let i = 0; i < 1900; i++) {
    const row = Math.floor(i / 50);
    const col = i % 50;
    const x = redStartX + col * 24 + row * 2;
    const y = redBaseY - row * 2;
    const c = new Character('artillery', x, y, TEAMS.RED);
    c.facing = -1;
    characters.push(c);
  }

  gameLoop();
}

      init();

      window.StickFight = {
        placeCharacter,
        getCharacters: () => characters.map(c => c.getData()),
        getStats: getTeamStats,
        clearAll: () => { characters = []; projectiles = []; particles = []; explosions = []; deathStats = { blue: 0, red: 0 }; },
        spawn: (template, x, teamId) => {
          const groundY = CONFIG.GROUND_Y - CONFIG.PLAYER_RADIUS;
          const team = teamId === 'red' ? TEAMS.RED : TEAMS.BLUE;
          const worldX = Math.max(CONFIG.PLAYER_RADIUS, Math.min(MAP_W - CONFIG.PLAYER_RADIUS, x));
          const c = new Character(template, worldX, groundY, team);
          characters.push(c);
          return c;
        },
        pause: () => { if (!isPaused) document.getElementById('pauseBtn').click(); },
        resume: () => { if (isPaused) document.getElementById('pauseBtn').click(); },
        isPaused: () => isPaused,
        getCameraX: () => cameraX,
        setCameraX: (x) => { cameraX = Math.max(0, Math.min(MAP_W - canvas.width, x)); },
        setSpeed: (s) => { gameSpeed = Math.max(1, Math.min(5, s)); document.getElementById('speedBtn').textContent = gameSpeed + 'x'; },
        getSpeed: () => gameSpeed,
        CONFIG, TEAMS,
      };

    })();
  </script>
</body>
